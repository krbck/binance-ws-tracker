name: Build and Update GitOps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Semgrep
        run: semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  build:
    needs: sast
    runs-on: ubuntu-latest

    concurrency:
      group: gitops-config
      cancel-in-progress: false

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Tag
        id: tag
        run: |
          DATE=$(date -u +%Y%m%d)
          TAG="${DATE}.${{ github.run_number }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT


      - name: Build Image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
          docker build -t $IMAGE .

      - name: Smoke Test
        run: |
          # websocket client + small HTTP API: must still run after 15s with no crash in the logs,
          # then GET /state/<id> must be 2xx (/health is 503 until Binance answers, so it is not used).
          # Runs the image just built; on failure prints its logs. The container is always removed.
          IMAGE=ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
          NAME=smoke-${{ github.run_id }}
          URL=http://127.0.0.1:18080/state/smoke-test
          trap 'docker rm -f "$NAME" >/dev/null 2>&1 || true' EXIT
          fail() { echo "::error::smoke test failed: $1"; docker logs "$NAME" 2>&1 | tail -n 200 || true; exit 1; }
          docker run -d --name "$NAME" -p 127.0.0.1:18080:3000 "$IMAGE"
          deadline=$((SECONDS + 60))
          sleep 15
          [ "$(docker inspect -f '{{.State.Running}}' "$NAME")" = "true" ] || fail "container not running after 15s"
          logs=$(docker logs "$NAME" 2>&1 || true)
          if grep -qE 'UnhandledPromiseRejection|Uncaught|node:internal|^[[:space:]]+at .+:[0-9]+:[0-9]+\)?$' <<<"$logs"; then
            fail "crash/stack trace in the logs"
          fi
          while [ "$SECONDS" -lt "$deadline" ]; do
            [ "$(docker inspect -f '{{.State.Running}}' "$NAME")" = "true" ] || fail "container exited"
            if curl -fsS -o /dev/null --max-time 3 "$URL"; then echo "smoke test passed: $URL"; exit 0; fi
            sleep 2
          done
          fail "no 2xx from $URL within 60s"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
          docker push $IMAGE

      - name: Checkout GitOps Repo
        uses: actions/checkout@v7
        with:
          repository: krbck/gitops-config
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops-config

      - name: Update Image Tag
        run: |
          cd gitops-config/applications/binance-ws-tracker
          sed -i "s/tag:.*/tag: \"${{ steps.tag.outputs.tag }}\"/" values.yaml


      - name: Commit and Push
        run: |
          cd gitops-config
          git config user.name "ci-bot"
          git config user.email "ci@local"
          git add applications/binance-ws-tracker/values.yaml
          git diff --cached --quiet && { echo "applications/binance-ws-tracker/values.yaml unchanged, nothing to commit"; exit 0; }
          git commit -m "update image tag"
          # Other repos push to gitops-config too (the concurrency group is per repo): on a
          # rejected push rebase onto the remote and retry, at most 3 times.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected (retry $attempt/3), rebasing onto the remote"
            sleep $((attempt * 5))
            git pull --rebase
          done
          git push
